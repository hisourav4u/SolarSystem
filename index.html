<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Orrery — An Explorable Solar System</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="labels"></div>

<div class="hud" id="brand">
  <h1>Orrery</h1>
  <p>A model of the Solar System</p>
</div>

<div class="hud" id="info">
  <button class="x" id="infoX" title="Close">✕</button>
  <div class="k">Body</div>
  <h2 id="iName">—</h2>
  <div class="sub" id="iType">—</div>
  <p class="desc" id="iDesc"></p>
  <div class="grid" id="iGrid"></div>
</div>

<div class="hud" id="rail"></div>

<div class="hud" id="ctl">
  <div class="row">
    <button class="btn" id="bOrbits">Orbits</button>
    <button class="btn" id="bLabels">Labels</button>
  </div>
  <div class="row">
    <button class="btn" id="bSlower">‹‹</button>
    <button class="btn" id="speed">1.0×</button>
    <button class="btn" id="bFaster">››</button>
  </div>
</div>

<div class="hud" id="hint">
  <div><b>Drag</b> orbit &nbsp; <b>Scroll</b> zoom &nbsp; <b>Click</b> a body</div>
</div>

<div id="boot"><div class="r"></div><p>Igniting the Sun…</p></div>
<div id="err"></div>

<script src="shaders.js"></script>
<script src="app.js"></script>
</body>
</html>
